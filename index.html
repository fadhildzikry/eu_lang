<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>European Phrasebook</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0e0f11;--bg2:#151618;--bg3:#1c1d20;
  --border:#2a2b2e;--border2:#3a3b3f;
  --text:#e8e9eb;--muted:#7a7b80;
  --fr:#6ea8d4;--de:#d4a66e;--es:#d46e6e;--it:#6ed4a0;--pt:#b06ed4;
  --accent:#c5f0a4;
  --tag-f:#2a3d2e;--tag-f-t:#7ecb88;
  --tag-i:#2d2a3d;--tag-i-t:#9b88cb;
  --tag-n:#2a2d3d;--tag-n-t:#88a0cb;
  --hdr:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace}
.hdr{height:var(--hdr);display:flex;align-items:center;gap:10px;padding:0 1rem;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;background:var(--bg);flex-shrink:0}
.hdr-title{flex:1;min-width:0}
.hdr-title h1{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:700;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title p{font-size:0.6rem;color:var(--muted);letter-spacing:0.05em;margin-top:1px}
.menu-btn{display:none;background:none;border:1px solid var(--border2);border-radius:5px;color:var(--muted);padding:6px 10px;cursor:pointer;font-size:1rem;line-height:1;flex-shrink:0}
.hdr-count{font-size:0.63rem;color:var(--muted);white-space:nowrap;flex-shrink:0}
.app{display:flex;height:calc(100vh - var(--hdr));overflow:hidden}
.sidebar{width:205px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:0.75rem 0 1.5rem}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2)}
.sb-label{font-size:0.57rem;letter-spacing:0.12em;color:var(--muted);padding:0 1rem;margin:10px 0 5px;text-transform:uppercase}
.lang-btn{display:flex;align-items:center;gap:9px;padding:8px 1rem;cursor:pointer;border:none;background:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:0.75rem;width:100%;text-align:left;transition:all 0.1s;border-left:2px solid transparent}
.lang-btn:hover{color:var(--text);background:var(--bg2)}
.lang-btn.active{color:var(--text);background:var(--bg2);border-left-color:var(--lc)}
.ldot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--lc)}
.sb-div{height:1px;background:var(--border);margin:0.6rem 0}
.cat-btn{display:block;padding:6px 1rem;cursor:pointer;border:none;background:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:0.68rem;width:100%;text-align:left;transition:color 0.1s;white-space:nowrap}
.cat-btn:hover{color:var(--text)}
.cat-btn.active{color:var(--accent)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.toolbar{display:flex;align-items:center;gap:8px;padding:0.65rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.toolbar input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:4px;padding:8px 11px;color:var(--text);font-family:'DM Mono',monospace;font-size:0.78rem;outline:none;min-width:0}
.toolbar input:focus{border-color:var(--accent)}
.toolbar input::placeholder{color:var(--muted)}
/* filter row */
.frow{display:flex;align-items:center;gap:6px;padding:0.45rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.frow-label{font-size:0.6rem;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap}
.ftag{padding:3px 10px;border-radius:99px;border:1px solid var(--border2);background:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:0.65rem;cursor:pointer;white-space:nowrap;transition:all 0.1s;-webkit-tap-highlight-color:transparent}
.ftag.f.active{border-color:var(--tag-f-t);color:var(--tag-f-t);background:var(--tag-f)}
.ftag.i.active{border-color:var(--tag-i-t);color:var(--tag-i-t);background:var(--tag-i)}
.ftag.n.active{border-color:var(--tag-n-t);color:var(--tag-n-t);background:var(--tag-n)}
.ftag.all.active{border-color:var(--accent);color:var(--accent);background:rgba(197,240,164,0.07)}
/* mobile chips */
.chips-row{display:none;gap:6px;padding:0.5rem 0.75rem;overflow-x:auto;border-bottom:1px solid var(--border);flex-shrink:0;-webkit-overflow-scrolling:touch}
.chips-row::-webkit-scrollbar{display:none}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:0.66rem;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.1s;-webkit-tap-highlight-color:transparent}
.chip.active{border-color:var(--accent);color:var(--accent);background:rgba(197,240,164,0.06)}
/* phrases */
.phrases{flex:1;overflow-y:auto;padding:0.75rem 1rem 3rem;display:flex;flex-direction:column;gap:7px;-webkit-overflow-scrolling:touch}
.phrases::-webkit-scrollbar{width:3px}
.phrases::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:10px 13px;display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;align-items:start;transition:border-color 0.1s}
.card:hover{border-color:var(--border2)}
.cn{font-size:0.82rem;font-weight:500;line-height:1.45}
.ce{font-size:0.77rem;color:var(--muted);line-height:1.45;font-style:italic}
.cmeta{grid-column:1/-1;display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap}
.tag{font-size:0.6rem;padding:2px 7px;border-radius:3px;letter-spacing:0.04em;font-weight:500}
.tag-F{background:var(--tag-f);color:var(--tag-f-t)}
.tag-I{background:var(--tag-i);color:var(--tag-i-t)}
.tag-N{background:var(--tag-n);color:var(--tag-n-t)}
.cnote{font-size:0.62rem;color:#4a4b52}
.sec{font-size:0.6rem;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;padding:5px 0 3px;margin-top:8px;border-bottom:1px solid var(--border);margin-bottom:3px}
.empty{padding:3rem;text-align:center;color:var(--muted);font-size:0.8rem}
/* lang accent */
[data-lang="fr"] .cn{color:#a8c8e8}
[data-lang="de"] .cn{color:#e8c88a}
[data-lang="es"] .cn{color:#e8a8a8}
[data-lang="it"] .cn{color:#a8e8c4}
[data-lang="pt"] .cn{color:#c8a8e8}
[data-lang="nl"] .cn{color:#f0c87a}
[data-lang="tr"] .cn{color:#f0908a}
/* drawer */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:30;-webkit-tap-highlight-color:transparent}
.overlay.open{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:245px;background:var(--bg);border-right:1px solid var(--border);z-index:40;transform:translateX(-100%);transition:transform 0.2s ease;overflow-y:auto;padding-bottom:2rem}
.drawer.open{transform:translateX(0)}
.drawer-hdr{display:flex;align-items:center;justify-content:space-between;padding:0.8rem 1rem;border-bottom:1px solid var(--border);margin-bottom:0.25rem;position:sticky;top:0;background:var(--bg);z-index:1}
.drawer-hdr span{font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)}
.drawer-hdr button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 6px;-webkit-tap-highlight-color:transparent}
/* legend */
.legend{display:flex;gap:8px;padding:0.5rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:4px;font-size:0.6rem;color:var(--muted)}
.leg-dot{width:8px;height:8px;border-radius:2px}
/* responsive */
@media(max-width:600px){
  .sidebar{display:none}
  .menu-btn{display:flex;align-items:center;justify-content:center}
  .chips-row{display:flex}
  .card{grid-template-columns:1fr;gap:4px}
  .ce{border-top:1px solid var(--border);padding-top:4px;margin-top:2px}
  .phrases{padding:0.6rem 0.75rem 4rem;gap:6px}
  .toolbar{padding:0.6rem 0.75rem}
  .hdr{padding:0 0.75rem}
  .frow{padding:0.4rem 0.75rem}
  .legend{padding:0.4rem 0.75rem}
}
</style>
</head>
<body>
<header class="hdr">
  <button class="menu-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
  <div class="hdr-title">
    <h1>European Phrasebook</h1>
    <p>FR · DE · ES · IT · PT &nbsp;—&nbsp; casual to clinical</p>
  </div>
  <span class="hdr-count" id="countEl"></span>
</header>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-hdr"><span>Menu</span><button id="drawerClose">&#10005;</button></div>
  <div id="drawerInner"></div>
</div>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search phrases…" autocomplete="off" autocorrect="off" spellcheck="false"/>
    </div>
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:var(--tag-f-t)"></div>Formal</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--tag-i-t)"></div>Informal</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--tag-n-t)"></div>Neutral</div>
    </div>
    <div class="frow">
      <span class="frow-label">Filter:</span>
      <button class="ftag all active" data-f="all">All</button>
      <button class="ftag f" data-f="F">Formal</button>
      <button class="ftag i" data-f="I">Informal</button>
      <button class="ftag n" data-f="N">Neutral</button>
    </div>
    <div class="chips-row" id="chips"></div>
    <div class="phrases" id="phraseList" data-lang="fr"></div>
  </div>
</div>
<script>

// SOCIAL
{c:"Social",f:"I",n:"On pourrait se retrouver pour un café ?",e:"Could we meet up for a coffee?"},
{c:"Social",f:"N",n:"C'était très agréable de vous parler.",e:"It was very nice talking to you."},
{c:"Social",f:"N",n:"Je suis désolé(e), je ne comprends pas.",e:"I'm sorry, I don't understand."},
{c:"Social",f:"F",n:"Excusez-moi, pouvez-vous m'aider ?",e:"Excuse me, can you help me?"},
{c:"Social",f:"F",n:"Vous avez une belle famille.",e:"You have a beautiful family."},
{c:"Social",f:"N",n:"Je suis ici pour un congrès médical.",e:"I'm here for a medical conference."},
{c:"Social",f:"I",n:"On a bien mangé ce soir !",e:"We ate well tonight!"},
{c:"Social",f:"F",n:"Merci beaucoup pour votre hospitalité.",e:"Thank you very much for your hospitality."},
{c:"Social",f:"I",n:"Tu veux qu'on aille quelque part après ?",e:"Do you want to go somewhere after?"},
{c:"Social",f:"F",n:"Je vous souhaite une excellente soirée.",e:"I wish you an excellent evening."},
{c:"Social",f:"N",n:"C'était une très bonne conférence.",e:"That was a very good conference."},
{c:"Social",f:"I",n:"T'as des plans ce week-end ?",e:"Do you have plans this weekend?",x:"Very casual"},
{c:"Social",f:"N",n:"Je dois malheureusement partir maintenant.",e:"I unfortunately have to leave now."},
{c:"Social",f:"I",n:"On garde contact ?",e:"Shall we stay in touch?"},
{c:"Social",f:"F",n:"Voici ma carte de visite.",e:"Here is my business card."},
{c:"Social",f:"I",n:"Tu es sur LinkedIn ?",e:"Are you on LinkedIn?"},
{c:"Social",f:"N",n:"C'était un plaisir de partager ce repas avec vous.",e:"It was a pleasure to share this meal with you."},
{c:"Social",f:"I",n:"Je t'envoie un message plus tard.",e:"I'll message you later."},
{c:"Social",f:"F",n:"Je serais ravi(e) de vous revoir lors du prochain congrès.",e:"I'd love to see you again at the next congress."},
{c:"Social",f:"I",n:"On s'est bien marrés ce soir !",e:"We had a great time tonight!"},
{c:"Social",f:"N",n:"Quelle est la meilleure façon de vous joindre ?",e:"What's the best way to reach you?"},
{c:"Social",f:"I",n:"Tu connais un bon endroit pour prendre un verre ?",e:"Do you know a good place to get a drink?"},
{c:"Social",f:"F",n:"Je vous remercie pour cette invitation.",e:"Thank you for this invitation."},
{c:"Social",f:"I",n:"C'est sympa de sortir après une longue journée.",e:"It's nice to go out after a long day."},
{c:"Social",f:"N",n:"On devrait faire ça plus souvent.",e:"We should do this more often."},
{c:"Social",f:"F",n:"Je vous souhaite beaucoup de succès dans vos projets.",e:"I wish you great success in your projects."},
{c:"Social",f:"I",n:"T'as une famille ici ou t'es tout seul en voyage ?",e:"Do you have family here or are you travelling alone?"},
{c:"Social",f:"I",n:"C'était super de faire ta connaissance.",e:"It was great to meet you."},
{c:"Social",f:"I",n:"T'as un bon resto à me conseiller dans le coin ?",e:"Got a good restaurant to recommend nearby?"},
{c:"Social",f:"I",n:"On mange ensemble un de ces jours ?",e:"Shall we grab a meal together some day?"},
{c:"Social",f:"I",n:"J'adore l'ambiance ici.",e:"I love the vibe here."},
{c:"Social",f:"I",n:"Tu viens souvent à ce genre de congrès ?",e:"Do you come to these conferences often?"},
{c:"Physician talk",f:"F",n:"Vous êtes dans quelle spécialité ?",e:"What is your specialty?"},
{c:"Physician talk",f:"I",n:"Tu bosses en quoi comme spécialité ?",e:"What specialty do you work in? (casual)"},
{c:"Physician talk",f:"F",n:"Je travaille aux urgences depuis cinq ans.",e:"I have been working in the emergency department for five years."},
{c:"Physician talk",f:"N",n:"Je suis interniste / urgentiste / généraliste.",e:"I am an internist / emergency physician / general practitioner."},
{c:"Physician talk",f:"F",n:"Quel est votre avis sur ce cas ?",e:"What is your opinion on this case?"},
{c:"Physician talk",f:"I",n:"T'as déjà vu un cas comme ça ?",e:"Have you ever seen a case like this?"},
{c:"Physician talk",f:"F",n:"Nous pratiquons selon les recommandations de la société de médecine interne.",e:"We follow internal medicine society guidelines."},
{c:"Physician talk",f:"N",n:"Comment gérez-vous la septicémie dans votre hôpital ?",e:"How do you manage sepsis at your hospital?"},
{c:"Physician talk",f:"F",n:"Avez-vous une expérience en médecine tropicale ?",e:"Do you have experience in tropical medicine?"},
{c:"Physician talk",f:"I",n:"On a beaucoup de paludisme chez nous en Indonésie.",e:"We see a lot of malaria back in Indonesia.",x:"Good conversation starter"},
{c:"Physician talk",f:"F",n:"Quelle est votre approche du triage aux urgences ?",e:"What is your approach to triage in the emergency department?"},
{c:"Physician talk",f:"N",n:"Nous utilisons le score HEART pour la douleur thoracique.",e:"We use the HEART score for chest pain."},
{c:"Physician talk",f:"F",n:"Avez-vous des recommandations locales différentes des guidelines internationaux ?",e:"Do you have local guidelines that differ from international ones?"},
{c:"Physician talk",f:"I",n:"On se retrouve au symposium cet après-midi ?",e:"Shall we meet at the symposium this afternoon?"},
{c:"Physician talk",f:"F",n:"Je serais très intéressé(e) par votre protocole de réanimation.",e:"I would be very interested in your resuscitation protocol."},
{c:"Physician talk",f:"N",n:"Votre système de santé fonctionne différemment du nôtre.",e:"Your healthcare system works differently from ours."},
{c:"Physician talk",f:"I",n:"Tu peux me recommander un bon article là-dessus ?",e:"Can you recommend a good article on that?"},
{c:"Physician talk",f:"F",n:"Puis-je vous demander votre avis sur le diagnostic différentiel ?",e:"May I ask your opinion on the differential diagnosis?"},
{c:"Physician talk",f:"N",n:"En Indonésie, nous voyons beaucoup de dengue et de typhoïde.",e:"In Indonesia, we see a lot of dengue and typhoid."},
{c:"Physician talk",f:"F",n:"Merci pour cet échange clinique très enrichissant.",e:"Thank you for this very enriching clinical exchange."},
// MEDICAL HISTORY
{c:"Medical history",f:"F",n:"Depuis combien de temps avez-vous ces symptômes ?",e:"How long have you had these symptoms?"},
{c:"Medical history",f:"F",n:"Avez-vous des antécédents médicaux ?",e:"Do you have any medical history?"},
{c:"Medical history",f:"F",n:"Prenez-vous des médicaments actuellement ?",e:"Are you currently taking any medications?"},
{c:"Medical history",f:"F",n:"Êtes-vous allergique à quelque chose ?",e:"Are you allergic to anything?"},
{c:"Medical history",f:"F",n:"Avez-vous subi une chirurgie auparavant ?",e:"Have you had surgery before?"},
{c:"Medical history",f:"F",n:"Avez-vous des antécédents familiaux de maladies cardiaques ?",e:"Do you have a family history of heart disease?"},
{c:"Medical history",f:"F",n:"Avez-vous déjà eu un AVC ou une crise cardiaque ?",e:"Have you ever had a stroke or heart attack?"},
{c:"Medical history",f:"F",n:"Fumez-vous ou consommez-vous de l'alcool ?",e:"Do you smoke or drink alcohol?"},
// SYMPTOMS
{c:"Symptoms",f:"F",n:"Où avez-vous mal exactement ?",e:"Where exactly does it hurt?"},
{c:"Symptoms",f:"F",n:"La douleur est-elle constante ou intermittente ?",e:"Is the pain constant or intermittent?"},
{c:"Symptoms",f:"F",n:"Sur une échelle de 1 à 10, évaluez votre douleur.",e:"On a scale of 1 to 10, rate your pain."},
{c:"Symptoms",f:"F",n:"Avez-vous de la fièvre, des nausées ou des vomissements ?",e:"Do you have fever, nausea, or vomiting?"},
{c:"Symptoms",f:"F",n:"Avez-vous du mal à respirer ?",e:"Are you having difficulty breathing?"},
{c:"Symptoms",f:"F",n:"Depuis quand avez-vous cette douleur dans la poitrine ?",e:"How long have you had this chest pain?"},
{c:"Symptoms",f:"F",n:"La douleur irradie-t-elle vers le bras ou la mâchoire ?",e:"Does the pain radiate to the arm or jaw?"},
{c:"Symptoms",f:"F",n:"Avez-vous des vertiges ou des étourdissements ?",e:"Do you have dizziness or lightheadedness?"},
{c:"Symptoms",f:"F",n:"Avez-vous remarqué du sang dans vos selles ou vos urines ?",e:"Have you noticed blood in your stool or urine?"},
// EXAMINATION
{c:"Examination",f:"F",n:"Je vais examiner votre abdomen, restez allongé(e).",e:"I'm going to examine your abdomen, stay lying down."},
{c:"Examination",f:"F",n:"Respirez profondément, s'il vous plaît.",e:"Please breathe deeply."},
{c:"Examination",f:"F",n:"Dites-moi si vous ressentez de la douleur ici.",e:"Tell me if you feel pain here."},
{c:"Examination",f:"F",n:"Pouvez-vous bouger ce bras / cette jambe ?",e:"Can you move this arm / this leg?"},
{c:"Examination",f:"F",n:"Je vais vérifier votre tension artérielle.",e:"I'm going to check your blood pressure."},
{c:"Examination",f:"F",n:"Serrez ma main aussi fort que possible.",e:"Squeeze my hand as hard as you can."},
{c:"Examination",f:"F",n:"Suivez mon doigt des yeux sans bouger la tête.",e:"Follow my finger with your eyes without moving your head."},
// DIAGNOSIS
{c:"Diagnosis",f:"F",n:"Les résultats suggèrent une infection.",e:"The results suggest an infection."},
{c:"Diagnosis",f:"F",n:"Nous devons faire des analyses supplémentaires.",e:"We need to run further tests."},
{c:"Diagnosis",f:"F",n:"Il s'agit probablement d'une inflammation.",e:"This is likely inflammation."},
{c:"Diagnosis",f:"F",n:"Je voudrais vous référer à un spécialiste.",e:"I would like to refer you to a specialist."},
{c:"Diagnosis",f:"F",n:"L'ECG montre des anomalies que nous devons surveiller.",e:"The ECG shows abnormalities we need to monitor."},
{c:"Diagnosis",f:"F",n:"La prise de sang montre un taux élevé d'inflammation.",e:"The blood test shows elevated inflammatory markers."},
{c:"Diagnosis",f:"F",n:"Nous avons besoin d'une radiographie du thorax.",e:"We need a chest X-ray."},
// INSTRUCTIONS
{c:"Instructions",f:"F",n:"Prenez ce médicament deux fois par jour.",e:"Take this medication twice a day."},
{c:"Instructions",f:"F",n:"Revenez dans une semaine pour un suivi.",e:"Come back in one week for follow-up."},
{c:"Instructions",f:"F",n:"Évitez les activités intenses pour l'instant.",e:"Avoid strenuous activity for now."},
{c:"Instructions",f:"F",n:"Buvez beaucoup d'eau et reposez-vous.",e:"Drink plenty of water and rest."},
{c:"Instructions",f:"F",n:"Ne prenez pas ce médicament à jeun.",e:"Don't take this medication on an empty stomach."},
{c:"Instructions",f:"F",n:"Revenez immédiatement si les symptômes s'aggravent.",e:"Return immediately if symptoms worsen."},
{c:"Instructions",f:"F",n:"Évitez les anticoagulants sans avis médical.",e:"Avoid blood thinners without medical advice."},
// URGENCY
{c:"Urgency",f:"F",n:"Appelez le 15 (SAMU) immédiatement.",e:"Call 15 (SAMU) immediately."},
{c:"Urgency",f:"F",n:"Nous devons l'hospitaliser d'urgence.",e:"We need to admit them urgently."},
{c:"Urgency",f:"F",n:"Ne mangez ni ne buvez rien maintenant.",e:"Do not eat or drink anything now."},
{c:"Urgency",f:"N",n:"Restez calme et ne bougez pas.",e:"Stay calm and don't move."},
{c:"Urgency",f:"F",n:"Nous allons vous mettre une perfusion maintenant.",e:"We're going to put in an IV line now."},
{c:"Urgency",f:"F",n:"Il y a un risque vital. Nous devons agir vite.",e:"There is a life-threatening risk. We must act fast."},
],

de:[
// GREETINGS
{c:"Greetings",f:"F",n:"Guten Tag, wie geht es Ihnen?",e:"Good day, how are you?"},
{c:"Greetings",f:"I",n:"Hallo! Wie geht's?",e:"Hello! How's it going?"},
{c:"Greetings",f:"F",n:"Schön, Sie kennenzulernen.",e:"Nice to meet you."},
{c:"Greetings",f:"N",n:"Gute Nacht.",e:"Good night."},
{c:"Greetings",f:"N",n:"Auf Wiedersehen / Tschüss.",e:"Goodbye / Bye."},
{c:"Greetings",f:"F",n:"Wie heißen Sie?",e:"What is your name?"},
{c:"Greetings",f:"I",n:"Wie heißt du?",e:"What's your name? (casual)"},
{c:"Greetings",f:"N",n:"Ich heiße Fadhil.",e:"My name is Fadhil."},
{c:"Greetings",f:"F",n:"Es freut mich, Sie kennenzulernen.",e:"I'm pleased to meet you."},
{c:"Greetings",f:"N",n:"Guten Morgen!",e:"Good morning!"},
{c:"Greetings",f:"N",n:"Guten Abend.",e:"Good evening."},
{c:"Greetings",f:"I",n:"Lange nicht gesehen!",e:"Long time no see!"},
{c:"Greetings",f:"I",n:"Wie läuft's?",e:"How's it going? (casual)"},
{c:"Greetings",f:"F",n:"Wie befinden Sie sich?",e:"How are you feeling? (formal)"},
{c:"Greetings",f:"N",n:"Sehr gut, danke. Und Ihnen?",e:"Very well, thank you. And you?"},
{c:"Greetings",f:"I",n:"Nicht schlecht, und dir?",e:"Not bad, and you? (casual)"},
{c:"Greetings",f:"N",n:"Ich freue mich, Sie zu sehen.",e:"I'm glad to see you."},
{c:"Greetings",f:"I",n:"Herzlich willkommen!",e:"Welcome!"},
{c:"Greetings",f:"F",n:"Darf ich mich vorstellen?",e:"May I introduce myself?"},
{c:"Greetings",f:"N",n:"Bis morgen.",e:"See you tomorrow."},
{c:"Greetings",f:"I",n:"Schönen Tag noch!",e:"Have a good day!"},
{c:"Greetings",f:"F",n:"Ich wünsche Ihnen einen angenehmen Tag.",e:"I wish you a pleasant day. (formal)"},
{c:"Greetings",f:"I",n:"Pass auf dich auf.",e:"Take care of yourself."},
{c:"Greetings",f:"I",n:"Hey, was geht?",e:"Hey, what's up?"},
{c:"Greetings",f:"I",n:"Na?",e:"Hey / How's it going? (very casual, typical German greeting)"},
{c:"Greetings",f:"I",n:"Schön dich zu sehen!",e:"Nice to see you!"},
{c:"Greetings",f:"I",n:"Sehen wir uns später?",e:"See you later?"},
{c:"Greetings",f:"I",n:"Hattest du einen guten Tag?",e:"Did you have a good day?"},
// BASICS
{c:"Basics",f:"N",n:"Nein.",e:"No."},
{c:"Basics",f:"N",n:"Vielleicht.",e:"Maybe."},
{c:"Basics",f:"N",n:"Okay. / In Ordnung.",e:"Okay. / Alright."},
{c:"Basics",f:"F",n:"Vielen Dank.",e:"Thank you very much."},
{c:"Basics",f:"I",n:"Danke!",e:"Thanks!"},
{c:"Basics",f:"N",n:"Bitte.",e:"You're welcome. / Please."},
{c:"Basics",f:"F",n:"Bitte sehr.",e:"You're very welcome. (formal)"},
{c:"Basics",f:"F",n:"Entschuldigung.",e:"Excuse me. / Sorry."},
{c:"Basics",f:"I",n:"Sorry!",e:"Sorry! (casual)"},
{c:"Basics",f:"F",n:"Es tut mir leid.",e:"I'm sorry. (formal)"},
{c:"Basics",f:"I",n:"Tut mir leid!",e:"Sorry! (casual)"},
{c:"Basics",f:"N",n:"Kein Problem.",e:"No problem."},
{c:"Basics",f:"N",n:"Ich weiß nicht.",e:"I don't know."},
{c:"Basics",f:"N",n:"Ich verstehe nicht.",e:"I don't understand."},
{c:"Basics",f:"N",n:"Ich verstehe.",e:"I understand."},
{c:"Basics",f:"N",n:"Natürlich.",e:"Of course."},
{c:"Basics",f:"N",n:"Überhaupt nicht.",e:"Not at all."},
{c:"Basics",f:"N",n:"Das ist okay.",e:"That's fine. / It's okay."},
{c:"Basics",f:"N",n:"Wiederholen Sie bitte.",e:"Please repeat that."},
{c:"Basics",f:"N",n:"Langsamer bitte.",e:"More slowly, please."},
{c:"Basics",f:"N",n:"Wie bitte?",e:"Pardon? / What?"},
{c:"Basics",f:"N",n:"Wirklich?",e:"Really?"},
{c:"Basics",f:"I",n:"Super!",e:"Great! / Awesome!"},
{c:"Basics",f:"N",n:"Das ist wichtig.",e:"That's important."},
{c:"Basics",f:"N",n:"Das ist dringend.",e:"It's urgent."},
{c:"Basics",f:"N",n:"Bitte warten Sie.",e:"Please wait."},
{c:"Basics",f:"N",n:"Einen Moment bitte.",e:"One moment, please."},
{c:"Basics",f:"N",n:"Wo ist die Toilette?",e:"Where are the toilets?"},
{c:"Basics",f:"N",n:"Ich brauche Hilfe.",e:"I need help."},
{c:"Basics",f:"N",n:"Was kostet das?",e:"How much does it cost?"},
{c:"Basics",f:"I",n:"Krass!",e:"Wow! / Crazy! (very casual)"},
{c:"Basics",f:"I",n:"Stimmt.",e:"That's right. / True."},
{c:"Basics",f:"I",n:"Keine Ahnung.",e:"No idea."},
{c:"Basics",f:"I",n:"Genau!",e:"Exactly! / That's it!"},
{c:"Basics",f:"I",n:"Lass mal.",e:"Forget it. / Never mind."},
{c:"Basics",f:"I",n:"Mach dir keine Sorgen.",e:"Don't worry."},
{c:"Basics",f:"N",n:"Gern geschehen.",e:"With pleasure. / Happy to help."},
{c:"Basics",f:"I",n:"Was ist das Problem?",e:"What's the problem?"},
{c:"Basics",f:"I",n:"Klingt gut!",e:"Sounds good!"},
// LANGUAGE
{c:"Language",f:"N",n:"Ja, ein bisschen. Ich lerne es gerade.",e:"Yes, a little. I'm learning it."},
{c:"Language",f:"N",n:"Ich spreche nicht so gut Deutsch.",e:"I don't speak German very well."},
{c:"Language",f:"F",n:"Können Sie das bitte langsamer wiederholen?",e:"Can you please repeat that more slowly?"},
{c:"Language",f:"N",n:"Wie sagt man ___ auf Deutsch?",e:"How do you say ___ in German?"},
{c:"Language",f:"N",n:"Ich verstehe etwas, aber ich spreche schlecht.",e:"I understand a little, but I speak poorly."},
{c:"Language",f:"F",n:"Können Sie das bitte aufschreiben?",e:"Can you write that down, please?"},
{c:"Language",f:"N",n:"Was bedeutet das?",e:"What does that mean?"},
{c:"Language",f:"I",n:"Ich bin noch Anfänger.",e:"I'm still a beginner."},
{c:"Language",f:"I",n:"Mein Deutsch ist ein bisschen eingerostet.",e:"My German is a bit rusty."},
{c:"Language",f:"I",n:"Kannst du mir bei der Aussprache helfen?",e:"Can you help me with my pronunciation?"},
{c:"Language",f:"N",n:"Ich verwechsle manchmal Wörter.",e:"I mix up words sometimes."},
{c:"Language",f:"I",n:"Das ist eine schwierige Sprache!",e:"It's a difficult language!"},
{c:"Language",f:"I",n:"Ich übe jeden Tag.",e:"I practise every day."},
// CASUAL
{c:"Casual",f:"I",n:"Was machst du so?",e:"What do you do? (casual)"},
{c:"Casual",f:"N",n:"Ich bin Notfallarzt / Notfallärtzin.",e:"I'm an emergency physician. (m/f)"},
{c:"Casual",f:"N",n:"Ich arbeite im Krankenhaus.",e:"I work at the hospital."},
{c:"Casual",f:"N",n:"Es ist schön hier.",e:"It's nice here."},
{c:"Casual",f:"F",n:"Woher kommen Sie?",e:"Where do you come from?"},
{c:"Casual",f:"I",n:"Woher kommst du?",e:"Where are you from? (casual)"},
{c:"Casual",f:"N",n:"Was empfehlen Sie zum Essen?",e:"What do you recommend to eat?"},
{c:"Casual",f:"N",n:"Ich mag Ihr Land sehr.",e:"I really like your country."},
{c:"Casual",f:"N",n:"Das Wetter ist heute schön.",e:"The weather is nice today."},
{c:"Casual",f:"N",n:"Es ist mein erster Besuch hier.",e:"It's my first time visiting here."},
{c:"Casual",f:"I",n:"Ich versuche, ein paar Wörter zu lernen.",e:"I'm trying to learn a few words."},
{c:"Casual",f:"N",n:"Ich komme aus Indonesien.",e:"I'm from Indonesia."},
{c:"Casual",f:"I",n:"Das ist eine wunderschöne Stadt!",e:"What a beautiful city!"},
{c:"Casual",f:"I",n:"Was machst du heute Abend?",e:"What are you up to tonight?"},
{c:"Casual",f:"N",n:"Ich brauche dringend einen guten Kaffee.",e:"I desperately need a good coffee."},
{c:"Casual",f:"I",n:"Was ist dein Lieblingsessen hier?",e:"What's your favourite dish here?"},
{c:"Casual",f:"N",n:"Der Flug war lang, aber es hat sich gelohnt.",e:"The flight was long but it was worth it."},
{c:"Casual",f:"I",n:"Ich bin etwas müde vom Jetlag.",e:"I'm a bit tired from the jet lag."},
{c:"Casual",f:"F",n:"Haben Sie Empfehlungen für die Stadt?",e:"Do you have any recommendations for the city?"},
{c:"Casual",f:"I",n:"Kennst du ein gutes Restaurant in der Nähe?",e:"Do you know a good restaurant nearby?"},
{c:"Casual",f:"N",n:"Es ist mein erstes Mal in Europa.",e:"It's my first time in Europe."},
{c:"Casual",f:"I",n:"Ich liebe die deutsche / europäische Küche.",e:"I love German / European food."},
{c:"Casual",f:"N",n:"Sprechen Sie auch Englisch?",e:"Do you also speak English?"},
{c:"Casual",f:"I",n:"Lustig, dass wir überall dieselben Krankenhausprobleme haben!",e:"Funny, we have the same hospital problems everywhere!"},
{c:"Casual",f:"N",n:"Ich würde gerne nächstes Jahr wiederkommen.",e:"I'd love to come back next year."},
{c:"Casual",f:"I",n:"Bist du hier aufgewachsen?",e:"Did you grow up here?"},
{c:"Casual",f:"N",n:"Die Kultur hier ist sehr anders als bei uns.",e:"The culture here is very different from home."},
{c:"Casual",f:"I",n:"Was machst du in deiner Freizeit?",e:"What do you do in your free time?"},
{c:"Casual",f:"I",n:"Hast du Geschwister?",e:"Do you have siblings?"},
{c:"Casual",f:"I",n:"Schaust du gerade irgendwelche Serien?",e:"Are you watching any shows right now?"},
{c:"Casual",f:"I",n:"Wie war deine Anreise?",e:"How was your journey?"},
{c:"Casual",f:"I",n:"Ich bin so müde, es war ein langer Tag.",e:"I'm so tired, it was a long day."},
// SOCIAL
{c:"Social",f:"I",n:"Treffen wir uns auf einen Kaffee?",e:"Shall we meet for a coffee?"},
{c:"Social",f:"N",n:"Es war sehr nett, mit Ihnen zu sprechen.",e:"It was very nice talking to you."},
{c:"Social",f:"N",n:"Entschuldigung, ich verstehe das nicht.",e:"Excuse me, I don't understand that."},
{c:"Social",f:"F",n:"Könnten Sie mir bitte helfen?",e:"Could you please help me?"},
{c:"Social",f:"F",n:"Sie haben eine schöne Familie.",e:"You have a beautiful family."},
{c:"Social",f:"N",n:"Ich bin hier für einen medizinischen Kongress.",e:"I'm here for a medical conference."},
{c:"Social",f:"I",n:"Das Essen heute Abend war ausgezeichnet!",e:"The food tonight was excellent!"},
{c:"Social",f:"F",n:"Vielen Dank für Ihre Gastfreundschaft.",e:"Thank you very much for your hospitality."},
{c:"Social",f:"I",n:"Hast du danach noch Pläne?",e:"Do you have plans after?"},
{c:"Social",f:"F",n:"Ich wünsche Ihnen einen schönen Abend.",e:"I wish you a lovely evening."},
{c:"Social",f:"N",n:"Das war eine sehr gute Konferenz.",e:"That was a very good conference."},
{c:"Social",f:"I",n:"Hast du Pläne für das Wochenende?",e:"Do you have plans for the weekend?"},
{c:"Social",f:"N",n:"Ich muss leider jetzt gehen.",e:"I unfortunately have to leave now."},
{c:"Social",f:"I",n:"Bleiben wir in Kontakt?",e:"Shall we stay in touch?"},
{c:"Social",f:"F",n:"Hier ist meine Visitenkarte.",e:"Here is my business card."},
{c:"Social",f:"I",n:"Bist du auf LinkedIn?",e:"Are you on LinkedIn?"},
{c:"Social",f:"N",n:"Es war schön, dieses Abendessen mit Ihnen zu teilen.",e:"It was lovely to share this dinner with you."},
{c:"Social",f:"I",n:"Ich schreibe dir später.",e:"I'll message you later."},
{c:"Social",f:"F",n:"Ich würde mich freuen, Sie beim nächsten Kongress wiederzusehen.",e:"I'd love to see you again at the next congress."},
{c:"Social",f:"I",n:"Das war ein toller Abend!",e:"That was a great evening!"},
{c:"Social",f:"N",n:"Wie kann ich Sie am besten erreichen?",e:"What's the best way to reach you?"},
{c:"Social",f:"I",n:"Kennst du eine gute Bar in der Nähe?",e:"Do you know a good bar nearby?"},
{c:"Social",f:"F",n:"Danke für die Einladung.",e:"Thank you for the invitation."},
{c:"Social",f:"I",n:"Es tut gut, nach einem langen Tag auszugehen.",e:"It's nice to go out after a long day."},
{c:"Social",f:"N",n:"Das sollten wir öfter machen.",e:"We should do this more often."},
{c:"Social",f:"I",n:"Reist du alleine oder hast du Familie dabei?",e:"Are you travelling alone or with family?"},
{c:"Social",f:"I",n:"Es war toll, dich kennenzulernen.",e:"It was great to meet you."},
{c:"Social",f:"I",n:"Kannst du ein gutes Restaurant in der Nähe empfehlen?",e:"Can you recommend a good restaurant nearby?"},
{c:"Social",f:"I",n:"Sollen wir mal zusammen essen gehen?",e:"Shall we grab a meal together?"},
{c:"Social",f:"I",n:"Ich mag die Atmosphäre hier sehr.",e:"I really like the atmosphere here."},
{c:"Social",f:"I",n:"Kommst du öfter zu solchen Kongressen?",e:"Do you come to these conferences often?"},
{c:"Physician talk",f:"I",n:"In welcher Fachrichtung arbeitest du?",e:"What specialty do you work in? (casual)"},
{c:"Physician talk",f:"F",n:"Ich arbeite seit fünf Jahren in der Notaufnahme.",e:"I have been working in the emergency department for five years."},
{c:"Physician talk",f:"N",n:"Ich bin Internist / Notfallmediziner / Allgemeinarzt.",e:"I am an internist / emergency physician / general practitioner."},
{c:"Physician talk",f:"F",n:"Was ist Ihre Einschätzung zu diesem Fall?",e:"What is your opinion on this case?"},
{c:"Physician talk",f:"I",n:"Hast du so einen Fall schon mal gesehen?",e:"Have you ever seen a case like this?"},
{c:"Physician talk",f:"F",n:"Wir orientieren uns an den Leitlinien der Deutschen Gesellschaft für Innere Medizin.",e:"We follow the guidelines of the German Society of Internal Medicine."},
{c:"Physician talk",f:"N",n:"Wie gehen Sie mit Sepsis in Ihrem Krankenhaus um?",e:"How do you manage sepsis at your hospital?"},
{c:"Physician talk",f:"F",n:"Haben Sie Erfahrung in der Tropenmedizin?",e:"Do you have experience in tropical medicine?"},
{c:"Physician talk",f:"I",n:"Bei uns in Indonesien sehen wir viel Malaria.",e:"We see a lot of malaria back in Indonesia.",x:"Good conversation starter"},
{c:"Physician talk",f:"F",n:"Wie gehen Sie in Ihrer Notaufnahme mit dem Triage vor?",e:"What is your approach to triage in the emergency department?"},
{c:"Physician talk",f:"N",n:"Wir verwenden den HEART-Score bei Brustschmerzen.",e:"We use the HEART score for chest pain."},
{c:"Physician talk",f:"F",n:"Haben Sie lokale Leitlinien, die von internationalen Empfehlungen abweichen?",e:"Do you have local guidelines that differ from international ones?"},
{c:"Physician talk",f:"I",n:"Sehen wir uns heute Nachmittag beim Symposium?",e:"Shall we meet at the symposium this afternoon?"},
{c:"Physician talk",f:"F",n:"Ich würde mich sehr für Ihr Reanimationsprotokoll interessieren.",e:"I would be very interested in your resuscitation protocol."},
{c:"Physician talk",f:"N",n:"Ihr Gesundheitssystem funktioniert anders als unseres.",e:"Your healthcare system works differently from ours."},
{c:"Physician talk",f:"I",n:"Kannst du mir einen guten Artikel dazu empfehlen?",e:"Can you recommend a good article on that?"},
{c:"Physician talk",f:"F",n:"Darf ich Sie nach Ihrer Meinung zur Differentialdiagnose fragen?",e:"May I ask your opinion on the differential diagnosis?"},
{c:"Physician talk",f:"N",n:"In Indonesien sehen wir viel Dengue und Typhus.",e:"In Indonesia, we see a lot of dengue and typhoid."},
{c:"Physician talk",f:"F",n:"Vielen Dank für diesen sehr bereichernden klinischen Austausch.",e:"Thank you for this very enriching clinical exchange."},
// MEDICAL HISTORY
{c:"Medical history",f:"F",n:"Seit wann haben Sie diese Beschwerden?",e:"How long have you had these complaints?"},
{c:"Medical history",f:"F",n:"Haben Sie Vorerkrankungen?",e:"Do you have any pre-existing conditions?"},
{c:"Medical history",f:"F",n:"Nehmen Sie derzeit Medikamente?",e:"Are you currently taking any medications?"},
{c:"Medical history",f:"F",n:"Sind Sie auf etwas allergisch?",e:"Are you allergic to anything?"},
{c:"Medical history",f:"F",n:"Wurden Sie schon einmal operiert?",e:"Have you had surgery before?"},
{c:"Medical history",f:"F",n:"Gibt es Herzerkrankungen in Ihrer Familie?",e:"Is there heart disease in your family?"},
{c:"Medical history",f:"F",n:"Hatten Sie schon einmal einen Schlaganfall oder Herzinfarkt?",e:"Have you ever had a stroke or heart attack?"},
{c:"Medical history",f:"F",n:"Rauchen Sie oder trinken Sie Alkohol?",e:"Do you smoke or drink alcohol?"},
// SYMPTOMS
{c:"Symptoms",f:"F",n:"Wo genau haben Sie Schmerzen?",e:"Where exactly do you have pain?"},
{c:"Symptoms",f:"F",n:"Ist der Schmerz dauerhaft oder kommt und geht er?",e:"Is the pain constant or does it come and go?"},
{c:"Symptoms",f:"F",n:"Bewerten Sie den Schmerz von 1 bis 10.",e:"Rate your pain from 1 to 10."},
{c:"Symptoms",f:"F",n:"Haben Sie Fieber, Übelkeit oder Erbrechen?",e:"Do you have fever, nausea, or vomiting?"},
{c:"Symptoms",f:"F",n:"Haben Sie Atemnot?",e:"Do you have shortness of breath?"},
{c:"Symptoms",f:"F",n:"Seit wann haben Sie diese Brustschmerzen?",e:"How long have you had this chest pain?"},
{c:"Symptoms",f:"F",n:"Strahlt der Schmerz in den Arm oder Kiefer aus?",e:"Does the pain radiate to the arm or jaw?"},
{c:"Symptoms",f:"F",n:"Haben Sie Schwindel oder Benommenheit?",e:"Do you have dizziness or lightheadedness?"},
{c:"Symptoms",f:"F",n:"Haben Sie Blut im Stuhl oder Urin bemerkt?",e:"Have you noticed blood in your stool or urine?"},
// EXAMINATION
{c:"Examination",f:"F",n:"Ich untersuche jetzt Ihren Bauch, bitte liegen bleiben.",e:"I'm going to examine your abdomen now, please stay lying down."},
{c:"Examination",f:"F",n:"Bitte tief einatmen.",e:"Please breathe in deeply."},
{c:"Examination",f:"F",n:"Sagen Sie mir, wenn es hier wehtut.",e:"Tell me if it hurts here."},
{c:"Examination",f:"F",n:"Können Sie diesen Arm / dieses Bein bewegen?",e:"Can you move this arm / this leg?"},
{c:"Examination",f:"F",n:"Ich messe jetzt Ihren Blutdruck.",e:"I'm going to check your blood pressure now."},
{c:"Examination",f:"F",n:"Drücken Sie meine Hand so fest wie möglich.",e:"Squeeze my hand as hard as you can."},
{c:"Examination",f:"F",n:"Folgen Sie meinem Finger mit den Augen, ohne den Kopf zu bewegen.",e:"Follow my finger with your eyes without moving your head."},
// DIAGNOSIS
{c:"Diagnosis",f:"F",n:"Die Befunde deuten auf eine Infektion hin.",e:"The findings suggest an infection."},
{c:"Diagnosis",f:"F",n:"Wir brauchen weitere Untersuchungen.",e:"We need further investigations."},
{c:"Diagnosis",f:"F",n:"Es handelt sich wahrscheinlich um eine Entzündung.",e:"This is likely inflammation."},
{c:"Diagnosis",f:"F",n:"Ich möchte Sie zu einem Spezialisten überweisen.",e:"I would like to refer you to a specialist."},
{c:"Diagnosis",f:"F",n:"Das EKG zeigt Auffälligkeiten, die wir beobachten müssen.",e:"The ECG shows abnormalities we need to monitor."},
{c:"Diagnosis",f:"F",n:"Der Bluttest zeigt erhöhte Entzündungswerte.",e:"The blood test shows elevated inflammatory markers."},
{c:"Diagnosis",f:"F",n:"Wir benötigen eine Röntgenaufnahme des Brustkorbs.",e:"We need a chest X-ray."},
// INSTRUCTIONS
{c:"Instructions",f:"F",n:"Nehmen Sie dieses Medikament zweimal täglich.",e:"Take this medication twice a day."},
{c:"Instructions",f:"F",n:"Kommen Sie in einer Woche zur Nachkontrolle.",e:"Come back in one week for a follow-up."},
{c:"Instructions",f:"F",n:"Vermeiden Sie vorerst anstrengende Aktivitäten.",e:"Avoid strenuous activity for now."},
{c:"Instructions",f:"F",n:"Trinken Sie viel Wasser und ruhen Sie sich aus.",e:"Drink plenty of water and rest."},
{c:"Instructions",f:"F",n:"Nehmen Sie dieses Medikament nicht nüchtern ein.",e:"Don't take this medication on an empty stomach."},
{c:"Instructions",f:"F",n:"Kommen Sie sofort zurück, wenn sich die Symptome verschlimmern.",e:"Return immediately if symptoms worsen."},
{c:"Instructions",f:"F",n:"Vermeiden Sie Blutverdünner ohne ärztlichen Rat.",e:"Avoid blood thinners without medical advice."},
// URGENCY
{c:"Urgency",f:"F",n:"Rufen Sie sofort den Notruf 112 an.",e:"Call emergency 112 immediately."},
{c:"Urgency",f:"F",n:"Wir müssen sie/ihn sofort einweisen.",e:"We need to admit them immediately."},
{c:"Urgency",f:"F",n:"Essen und trinken Sie jetzt nichts.",e:"Do not eat or drink anything now."},
{c:"Urgency",f:"N",n:"Bleiben Sie ruhig und bewegen Sie sich nicht.",e:"Stay calm and don't move."},
{c:"Urgency",f:"F",n:"Wir legen jetzt einen Venenzugang.",e:"We're going to put in an IV line now."},
{c:"Urgency",f:"F",n:"Es besteht Lebensgefahr. Wir müssen sofort handeln.",e:"There is a life-threatening risk. We must act immediately."},

// GREETINGS

{c:"Greetings",f:"N",n:"Hasta luego / Adiós.",e:"See you later / Goodbye."},
{c:"Greetings",f:"F",n:"¿Cómo se llama usted?",e:"What is your name?"},

{c:"Greetings",f:"N",n:"Me llamo Fadhil.",e:"My name is Fadhil."},

{c:"Greetings",f:"N",n:"¡Buenos días!",e:"Good morning!"},

{c:"Greetings",f:"I",n:"¿Cómo te va?",e:"How's it going? (casual)"},
{c:"Greetings",f:"F",n:"¿Cómo se encuentra usted?",e:"How are you feeling? (formal)"},
{c:"Greetings",f:"N",n:"Muy bien, gracias. ¿Y usted?",e:"Very well, thank you. And you?"},
{c:"Greetings",f:"I",n:"No está mal. ¿Y tú?",e:"Not bad. And you? (casual)"},
{c:"Greetings",f:"N",n:"Me alegra verle.",e:"I'm glad to see you."},
{c:"Greetings",f:"I",n:"¡Bienvenido/a!",e:"Welcome!"},
{c:"Greetings",f:"F",n:"Permítame presentarme.",e:"Allow me to introduce myself."},
{c:"Greetings",f:"N",n:"Hasta mañana.",e:"See you tomorrow."},
{c:"Greetings",f:"I",n:"¡Que tengas un buen día!",e:"Have a good day! (casual)"},
{c:"Greetings",f:"F",n:"Que tenga usted un excelente día.",e:"Have an excellent day. (formal)"},
{c:"Greetings",f:"I",n:"Cuídate.",e:"Take care of yourself."},
{c:"Greetings",f:"I",n:"¡Eh, qué pasa!",e:"Hey, what's up! (very casual)"},
{c:"Greetings",f:"I",n:"¿Qué tal todo?",e:"How's everything going?"},
{c:"Greetings",f:"I",n:"¡Me alegro de verte!",e:"Great to see you!"},
{c:"Greetings",f:"I",n:"¿Nos vemos luego?",e:"See you later?"},
{c:"Greetings",f:"I",n:"¿Qué tal el día?",e:"How was your day?"},
// BASICS
{c:"Basics",f:"N",n:"Sí.",e:"Yes."},
{c:"Basics",f:"N",n:"No.",e:"No."},

{c:"Basics",f:"N",n:"De acuerdo. / Vale.",e:"Okay. / Alright."},

{c:"Basics",f:"N",n:"De nada.",e:"You're welcome."},
{c:"Basics",f:"F",n:"No hay de qué.",e:"Don't mention it. (formal)"},
{c:"Basics",f:"F",n:"Perdone.",e:"Excuse me. (formal)"},
{c:"Basics",f:"I",n:"Perdona.",e:"Excuse me. (casual)"},
{c:"Basics",f:"F",n:"Lo siento mucho.",e:"I'm very sorry. (formal)"},
{c:"Basics",f:"I",n:"¡Lo siento!",e:"Sorry! (casual)"},
{c:"Basics",f:"N",n:"No hay problema.",e:"No problem."},
{c:"Basics",f:"N",n:"Por favor.",e:"Please."},
{c:"Basics",f:"N",n:"No sé.",e:"I don't know."},
{c:"Basics",f:"N",n:"No entiendo.",e:"I don't understand."},
{c:"Basics",f:"N",n:"Entiendo.",e:"I understand."},
{c:"Basics",f:"N",n:"Por supuesto.",e:"Of course."},
{c:"Basics",f:"N",n:"En absoluto.",e:"Not at all."},

{c:"Basics",f:"I",n:"¡Genial!",e:"Great! / Awesome!"},
{c:"Basics",f:"N",n:"Es importante.",e:"That's important."},
{c:"Basics",f:"N",n:"Es urgente.",e:"It's urgent."},

{c:"Basics",f:"N",n:"Necesito ayuda.",e:"I need help."},
{c:"Basics",f:"N",n:"¿Cuánto cuesta?",e:"How much does it cost?"},
{c:"Basics",f:"I",n:"¡Qué guay!",e:"How cool! / Awesome! (Spain)"},
{c:"Basics",f:"I",n:"Claro que sí.",e:"Of course, yes."},
{c:"Basics",f:"I",n:"Ni idea.",e:"No idea."},
{c:"Basics",f:"I",n:"Exacto.",e:"Exactly."},
{c:"Basics",f:"I",n:"Déjalo.",e:"Forget it. / Never mind."},
{c:"Basics",f:"I",n:"No te preocupes.",e:"Don't worry."},
{c:"Basics",f:"N",n:"Con mucho gusto.",e:"With pleasure."},
{c:"Basics",f:"I",n:"¿Cuál es el problema?",e:"What's the problem?"},
{c:"Basics",f:"I",n:"¡Perfecto!",e:"Perfect! / Sounds good!"},

{c:"Language",f:"N",n:"Sí, un poco. Lo estoy aprendiendo.",e:"Yes, a little. I'm learning it."},

// CASUAL
{c:"Casual",f:"I",n:"¿A qué te dedicas?",e:"What do you do? (casual)"},
{c:"Casual",f:"N",n:"Soy médico/a de urgencias.",e:"I'm an emergency physician."},
{c:"Casual",f:"N",n:"Trabajo en el hospital.",e:"I work at the hospital."},
{c:"Casual",f:"N",n:"Este lugar es muy bonito.",e:"This place is very nice."},
{c:"Casual",f:"F",n:"¿De dónde es usted?",e:"Where are you from?"},
{c:"Casual",f:"I",n:"¿De dónde eres?",e:"Where are you from? (casual)"},
{c:"Casual",f:"N",n:"¿Qué me recomienda para comer?",e:"What do you recommend to eat?"},
{c:"Casual",f:"N",n:"Me gusta mucho su país.",e:"I really like your country."},
{c:"Casual",f:"N",n:"Hoy hace buen tiempo.",e:"The weather is nice today."},
{c:"Casual",f:"N",n:"Es mi primera visita aquí.",e:"It's my first time visiting here."},

{c:"Casual",f:"I",n:"¡Qué ciudad tan bonita!",e:"What a beautiful city!"},

{c:"Casual",f:"N",n:"Necesito un buen café.",e:"I need a good coffee."},
{c:"Casual",f:"I",n:"¿Cuál es tu plato favorito aquí?",e:"What's your favourite dish here?"},
{c:"Casual",f:"N",n:"El vuelo fue largo pero valió la pena.",e:"The flight was long but it was worth it."},
{c:"Casual",f:"I",n:"Estoy un poco cansado/a del jet lag.",e:"I'm a bit tired from the jet lag."},

{c:"Casual",f:"I",n:"¿Conoces algún buen restaurante cerca?",e:"Do you know a good restaurant nearby?"},
{c:"Casual",f:"N",n:"Es la primera vez que vengo a Europa.",e:"It's my first time coming to Europe."},
{c:"Casual",f:"I",n:"Me encanta la comida española / europea.",e:"I love Spanish / European food."},

{c:"Casual",f:"I",n:"¿Qué haces en tu tiempo libre?",e:"What do you do in your free time?"},

{c:"Casual",f:"I",n:"¿Ves alguna serie ahora mismo?",e:"Are you watching any shows right now?"},
{c:"Casual",f:"I",n:"¿Qué tal el viaje?",e:"How was your journey?"},
{c:"Casual",f:"I",n:"Estoy agotado/a, ha sido un día muy largo.",e:"I'm exhausted, it's been a really long day."},

{c:"Social",f:"I",n:"¿Quedamos para tomar un café?",e:"Shall we meet up for a coffee?"},

{c:"Social",f:"N",n:"Lo siento, no entiendo.",e:"I'm sorry, I don't understand."},

{c:"Social",f:"N",n:"Deberíamos hacer esto más a menudo.",e:"We should do this more often."},

{c:"Social",f:"I",n:"¿Me puedes recomendar algún buen sitio para comer?",e:"Can you recommend a good place to eat?"},

{c:"Examination",f:"F",n:"Siga meu dedo com os olhos sem mover a cabeça.",e:"Follow my finger with your eyes without moving your head."},

{c:"Diagnosis",f:"F",n:"Precisamos de mais exames.",e:"We need further tests."},
{c:"Diagnosis",f:"F",n:"Provavelmente trata-se de uma inflamação.",e:"This is likely inflammation."},
{c:"Diagnosis",f:"F",n:"Gostaria de encaminhá-lo/a a um especialista.",e:"I would like to refer you to a specialist."},
{c:"Diagnosis",f:"F",n:"O ECG mostra alterações que precisamos monitorar.",e:"The ECG shows abnormalities we need to monitor."},
{c:"Diagnosis",f:"F",n:"O exame de sangue mostra marcadores inflamatórios elevados.",e:"The blood test shows elevated inflammatory markers."},
{c:"Diagnosis",f:"F",n:"Precisamos de uma radiografia do tórax.",e:"We need a chest X-ray."},
// INSTRUCTIONS
{c:"Instructions",f:"F",n:"Tome este medicamento duas vezes ao dia.",e:"Take this medication twice a day."},
{c:"Instructions",f:"F",n:"Volte em uma semana para acompanhamento.",e:"Come back in one week for follow-up."},
{c:"Instructions",f:"F",n:"Evite atividades intensas por enquanto.",e:"Avoid strenuous activity for now."},
{c:"Instructions",f:"F",n:"Beba bastante água e descanse.",e:"Drink plenty of water and rest."},
{c:"Instructions",f:"F",n:"Não tome este medicamento com o estômago vazio.",e:"Don't take this medication on an empty stomach."},
{c:"Instructions",f:"F",n:"Volte imediatamente se os sintomas piorarem.",e:"Return immediately if symptoms worsen."},
{c:"Instructions",f:"F",n:"Evite anticoagulantes sem orientação médica.",e:"Avoid blood thinners without medical advice."},
// URGENCY

{c:"Urgency",f:"F",n:"Precisamos interná-lo/a com urgência.",e:"We need to admit them urgently."},
{c:"Urgency",f:"F",n:"Não coma nem beba nada agora.",e:"Do not eat or drink anything now."},
{c:"Urgency",f:"N",n:"Fique calmo/a e não se mexa.",e:"Stay calm and don't move."},

// BASICS

// CASUAL
{c:"Casual",f:"F",n:"Wat doet u voor de kost?",e:"What do you do for a living? (formal)"},
{c:"Casual",f:"I",n:"Wat doe jij voor werk?",e:"What do you do for work? (casual)"},
{c:"Casual",f:"N",n:"Ik ben spoedeisende arts.",e:"I'm an emergency physician."},
{c:"Casual",f:"N",n:"Ik werk in het ziekenhuis.",e:"I work at the hospital."},
{c:"Casual",f:"N",n:"Het is hier mooi.",e:"It's nice here."},
{c:"Casual",f:"F",n:"Waar komt u vandaan?",e:"Where do you come from? (formal)"},
{c:"Casual",f:"I",n:"Waar kom je vandaan?",e:"Where are you from? (casual)"},
{c:"Casual",f:"N",n:"Wat raadt u aan om te eten?",e:"What do you recommend to eat?"},
{c:"Casual",f:"N",n:"Ik vind uw land erg mooi.",e:"I really like your country."},
{c:"Casual",f:"N",n:"Het weer is vandaag mooi.",e:"The weather is nice today."},
{c:"Casual",f:"N",n:"Het is mijn eerste bezoek hier.",e:"It's my first time visiting here."},
{c:"Casual",f:"I",n:"Ik probeer wat woorden te leren.",e:"I'm trying to learn a few words."},
{c:"Casual",f:"N",n:"Ik kom uit Indonesië.",e:"I'm from Indonesia."},
{c:"Casual",f:"I",n:"Wat een mooie stad!",e:"What a beautiful city!"},
{c:"Casual",f:"I",n:"Wat doe je vanavond?",e:"What are you up to tonight?"},
{c:"Casual",f:"N",n:"Ik heb dringend een goede koffie nodig.",e:"I really need a good coffee."},
{c:"Casual",f:"I",n:"Wat is je favoriete gerecht hier?",e:"What's your favourite dish here?"},
{c:"Casual",f:"N",n:"De vlucht was lang maar het was het waard.",e:"The flight was long but it was worth it."},
{c:"Casual",f:"I",n:"Ik ben een beetje moe van de jetlag.",e:"I'm a bit tired from the jet lag."},
{c:"Casual",f:"N",n:"Is het uw eerste keer in Europa?",e:"Is it your first time in Europe?"},
{c:"Casual",f:"I",n:"Ken jij een goed restaurant in de buurt?",e:"Do you know a good restaurant nearby?"},
{c:"Casual",f:"I",n:"Ik hou van de Nederlandse keuken.",e:"I love Dutch food."},
{c:"Casual",f:"N",n:"Spreekt u ook Engels?",e:"Do you also speak English?"},
{c:"Casual",f:"I",n:"Grappig, we hebben overal dezelfde ziekenhuisproblemen!",e:"Funny, we have the same hospital problems everywhere!"},
{c:"Casual",f:"N",n:"Ik hoop volgend jaar terug te komen.",e:"I hope to come back next year."},
{c:"Casual",f:"I",n:"Ben je hier opgegroeid?",e:"Did you grow up here?"},
{c:"Casual",f:"N",n:"De cultuur hier is heel anders dan thuis.",e:"The culture here is very different from home."},
{c:"Casual",f:"I",n:"Wat doe je in je vrije tijd?",e:"What do you do in your free time?"},
{c:"Casual",f:"I",n:"Heb je broers of zussen?",e:"Do you have siblings?"},
{c:"Casual",f:"I",n:"Kijk je momenteel een serie?",e:"Are you watching any shows right now?"},
{c:"Casual",f:"I",n:"Hoe was je reis?",e:"How was your journey?"},
{c:"Casual",f:"I",n:"Ik ben uitgeput, het was een lange dag.",e:"I'm exhausted, it's been a long day."},
// SOCIAL
{c:"Social",f:"I",n:"Zullen we koffie drinken?",e:"Shall we grab a coffee?"},
{c:"Social",f:"N",n:"Het was erg prettig met u te spreken.",e:"It was very nice talking to you."},
{c:"Social",f:"N",n:"Sorry, ik begrijp het niet.",e:"Sorry, I don't understand."},
{c:"Social",f:"F",n:"Kunt u mij helpen?",e:"Can you help me?"},
{c:"Social",f:"F",n:"U heeft een mooie familie.",e:"You have a beautiful family."},
{c:"Social",f:"N",n:"Ik ben hier voor een medisch congres.",e:"I'm here for a medical conference."},
{c:"Social",f:"I",n:"Het eten vanavond was geweldig!",e:"The food tonight was amazing!"},
{c:"Social",f:"F",n:"Hartelijk dank voor uw gastvrijheid.",e:"Thank you very much for your hospitality."},
{c:"Social",f:"I",n:"Heb je daarna nog plannen?",e:"Do you have plans after?"},
{c:"Social",f:"F",n:"Ik wens u een fijne avond.",e:"I wish you a lovely evening."},
{c:"Social",f:"N",n:"Het was een heel goede conferentie.",e:"That was a very good conference."},
{c:"Social",f:"I",n:"Heb je plannen voor het weekend?",e:"Do you have plans for the weekend?"},
{c:"Social",f:"N",n:"Ik moet helaas nu gaan.",e:"I unfortunately have to leave now."},
{c:"Social",f:"I",n:"Blijven we contact houden?",e:"Shall we stay in touch?"},
{c:"Social",f:"F",n:"Hier is mijn visitekaartje.",e:"Here is my business card."},
{c:"Social",f:"I",n:"Zit je op LinkedIn?",e:"Are you on LinkedIn?"},
{c:"Social",f:"N",n:"Het was fijn dit diner met u te delen.",e:"It was lovely to share this dinner with you."},
{c:"Social",f:"I",n:"Ik stuur je later een berichtje.",e:"I'll message you later."},
{c:"Social",f:"F",n:"Ik hoop u op het volgende congres te zien.",e:"I hope to see you at the next congress."},
{c:"Social",f:"I",n:"Het was een geweldige avond!",e:"That was a great evening!"},
{c:"Social",f:"N",n:"Hoe kan ik u het beste bereiken?",e:"What's the best way to reach you?"},
{c:"Social",f:"I",n:"Ken je een goede bar in de buurt?",e:"Do you know a good bar nearby?"},
{c:"Social",f:"F",n:"Bedankt voor de uitnodiging.",e:"Thank you for the invitation."},
{c:"Social",f:"I",n:"Het is fijn om even uit te gaan na zo'n lange dag.",e:"It's nice to go out after such a long day."},
{c:"Social",f:"N",n:"Dit zouden we vaker moeten doen.",e:"We should do this more often."},
{c:"Social",f:"I",n:"Reis je alleen of met familie?",e:"Are you travelling alone or with family?"},
{c:"Social",f:"I",n:"Het was geweldig je te ontmoeten.",e:"It was great to meet you."},
{c:"Social",f:"I",n:"Ken je een goed restaurant hier in de buurt?",e:"Can you recommend a good restaurant nearby?"},
{c:"Social",f:"I",n:"Zullen we een keer samen eten?",e:"Shall we grab a meal together some day?"},
{c:"Social",f:"I",n:"Ik vind de sfeer hier geweldig.",e:"I love the vibe here."},
{c:"Social",f:"I",n:"Kom je vaak naar dit soort congressen?",e:"Do you come to these conferences often?"},
// PHYSICIAN TALK
{c:"Physician talk",f:"F",n:"Wat is uw specialisatie?",e:"What is your specialty?"},
{c:"Physician talk",f:"I",n:"In welk vakgebied werk jij?",e:"What specialty do you work in? (casual)"},
{c:"Physician talk",f:"F",n:"Ik werk al vijf jaar op de spoedeisende hulp.",e:"I have been working in the emergency department for five years."},
{c:"Physician talk",f:"N",n:"Ik ben internist / spoedeisende arts / huisarts.",e:"I am an internist / emergency physician / GP."},
{c:"Physician talk",f:"F",n:"Wat is uw mening over deze casus?",e:"What is your opinion on this case?"},
{c:"Physician talk",f:"I",n:"Heb je ooit zo'n geval gezien?",e:"Have you ever seen a case like this?"},
{c:"Physician talk",f:"F",n:"Wij volgen de richtlijnen van de Nederlandse Internisten Vereniging.",e:"We follow the guidelines of the Dutch Society of Internal Medicine."},
{c:"Physician talk",f:"N",n:"Hoe gaat u om met sepsis in uw ziekenhuis?",e:"How do you manage sepsis at your hospital?"},
{c:"Physician talk",f:"F",n:"Heeft u ervaring met tropische geneeskunde?",e:"Do you have experience in tropical medicine?"},
{c:"Physician talk",f:"I",n:"In Indonesië zien we veel malaria.",e:"We see a lot of malaria back in Indonesia.",x:"Good conversation starter"},
{c:"Physician talk",f:"F",n:"Wat is uw benadering van triage op de SEH?",e:"What is your approach to triage in the emergency department?"},
{c:"Physician talk",f:"N",n:"Wij gebruiken de HEART-score bij thoracale pijn.",e:"We use the HEART score for chest pain."},
{c:"Physician talk",f:"F",n:"Heeft u lokale richtlijnen die afwijken van internationale?",e:"Do you have local guidelines that differ from international ones?"},
{c:"Physician talk",f:"I",n:"Zien we elkaar vanmiddag op het symposium?",e:"Shall we meet at the symposium this afternoon?"},
{c:"Physician talk",f:"F",n:"Ik zou graag meer weten over uw reanimatieprotocol.",e:"I would be very interested in your resuscitation protocol."},
{c:"Physician talk",f:"N",n:"Uw gezondheidssysteem werkt anders dan het onze.",e:"Your healthcare system works differently from ours."},
{c:"Physician talk",f:"I",n:"Kun je me een goed artikel hierover aanbevelen?",e:"Can you recommend a good article on that?"},
{c:"Physician talk",f:"F",n:"Mag ik u vragen naar uw mening over de differentiaaldiagnose?",e:"May I ask your opinion on the differential diagnosis?"},
{c:"Physician talk",f:"N",n:"In Indonesië zien we veel dengue en tyfus.",e:"In Indonesia, we see a lot of dengue and typhoid."},
{c:"Physician talk",f:"F",n:"Dank u wel voor deze verrijkende klinische uitwisseling.",e:"Thank you for this very enriching clinical exchange."},
// MEDICAL HISTORY
{c:"Medical history",f:"F",n:"Hoe lang heeft u deze klachten al?",e:"How long have you had these complaints?"},
{c:"Medical history",f:"F",n:"Heeft u voorbestaande aandoeningen?",e:"Do you have any pre-existing conditions?"},
{c:"Medical history",f:"F",n:"Gebruikt u momenteel medicijnen?",e:"Are you currently taking any medications?"},
{c:"Medical history",f:"F",n:"Bent u ergens allergisch voor?",e:"Are you allergic to anything?"},
{c:"Medical history",f:"F",n:"Heeft u eerder een operatie gehad?",e:"Have you had surgery before?"},
{c:"Medical history",f:"F",n:"Zijn er hart- en vaatziekten in uw familie?",e:"Is there heart disease in your family?"},
{c:"Medical history",f:"F",n:"Heeft u ooit een beroerte of hartaanval gehad?",e:"Have you ever had a stroke or heart attack?"},
{c:"Medical history",f:"F",n:"Rookt u of drinkt u alcohol?",e:"Do you smoke or drink alcohol?"},
// SYMPTOMS
{c:"Symptoms",f:"F",n:"Waar heeft u precies pijn?",e:"Where exactly do you have pain?"},
{c:"Symptoms",f:"F",n:"Is de pijn constant of komt en gaat die?",e:"Is the pain constant or does it come and go?"},
{c:"Symptoms",f:"F",n:"Geef de pijn een cijfer van 1 tot 10.",e:"Rate your pain from 1 to 10."},
{c:"Symptoms",f:"F",n:"Heeft u koorts, misselijkheid of braken?",e:"Do you have fever, nausea, or vomiting?"},
{c:"Symptoms",f:"F",n:"Heeft u kortademigheid?",e:"Do you have shortness of breath?"},
{c:"Symptoms",f:"F",n:"Hoe lang heeft u deze pijn op de borst al?",e:"How long have you had this chest pain?"},
{c:"Symptoms",f:"F",n:"Straalt de pijn uit naar de arm of kaak?",e:"Does the pain radiate to the arm or jaw?"},
{c:"Symptoms",f:"F",n:"Heeft u duizeligheid of een licht gevoel in het hoofd?",e:"Do you have dizziness or lightheadedness?"},
{c:"Symptoms",f:"F",n:"Heeft u bloed in uw ontlasting of urine gezien?",e:"Have you noticed blood in your stool or urine?"},
// EXAMINATION
{c:"Examination",f:"F",n:"Ik ga uw buik onderzoeken, blijft u liggen.",e:"I'm going to examine your abdomen, stay lying down."},
{c:"Examination",f:"F",n:"Adem diep in, alstublieft.",e:"Please breathe in deeply."},
{c:"Examination",f:"F",n:"Zegt u het als het hier pijn doet.",e:"Tell me if it hurts here."},
{c:"Examination",f:"F",n:"Kunt u deze arm / dit been bewegen?",e:"Can you move this arm / this leg?"},
{c:"Examination",f:"F",n:"Ik meet nu uw bloeddruk.",e:"I'm going to check your blood pressure now."},
{c:"Examination",f:"F",n:"Knijp zo hard mogelijk in mijn hand.",e:"Squeeze my hand as hard as you can."},
{c:"Examination",f:"F",n:"Volg mijn vinger met uw ogen zonder uw hoofd te bewegen.",e:"Follow my finger with your eyes without moving your head."},
// DIAGNOSIS
{c:"Diagnosis",f:"F",n:"De bevindingen wijzen op een infectie.",e:"The findings suggest an infection."},
{c:"Diagnosis",f:"F",n:"We hebben verder onderzoek nodig.",e:"We need further investigations."},
{c:"Diagnosis",f:"F",n:"Het gaat waarschijnlijk om een ontsteking.",e:"This is likely inflammation."},
{c:"Diagnosis",f:"F",n:"Ik wil u doorverwijzen naar een specialist.",e:"I would like to refer you to a specialist."},
{c:"Diagnosis",f:"F",n:"Het ECG toont afwijkingen die we moeten bewaken.",e:"The ECG shows abnormalities we need to monitor."},
{c:"Diagnosis",f:"F",n:"Het bloedonderzoek toont verhoogde ontstekingswaarden.",e:"The blood test shows elevated inflammatory markers."},
{c:"Diagnosis",f:"F",n:"We hebben een röntgenfoto van de borstkas nodig.",e:"We need a chest X-ray."},
// INSTRUCTIONS
{c:"Instructions",f:"F",n:"Neem dit medicijn tweemaal per dag.",e:"Take this medication twice a day."},
{c:"Instructions",f:"F",n:"Kom over een week terug voor controle.",e:"Come back in one week for a follow-up."},
{c:"Instructions",f:"F",n:"Vermijd zware inspanning voorlopig.",e:"Avoid strenuous activity for now."},
{c:"Instructions",f:"F",n:"Drink veel water en rust uit.",e:"Drink plenty of water and rest."},
{c:"Instructions",f:"F",n:"Neem dit medicijn niet op een lege maag.",e:"Don't take this medication on an empty stomach."},
{c:"Instructions",f:"F",n:"Kom onmiddellijk terug als de klachten verergeren.",e:"Return immediately if symptoms worsen."},
{c:"Instructions",f:"F",n:"Vermijd bloedverdunners zonder medisch advies.",e:"Avoid blood thinners without medical advice."},
// URGENCY
{c:"Urgency",f:"F",n:"Bel onmiddellijk 112.",e:"Call 112 immediately."},
{c:"Urgency",f:"F",n:"We moeten u/hem/haar dringend opnemen.",e:"We need to admit them urgently."},
{c:"Urgency",f:"F",n:"Eet of drink nu niets.",e:"Do not eat or drink anything now."},

function buildNav(el){
  el.innerHTML=navHTML();
  el.querySelectorAll(".lang-btn").forEach(b=>b.addEventListener("click",()=>{
    lang=b.dataset.lang;
    document.getElementById("phraseList").dataset.lang=lang;
    refreshAll();closeDrawer();
  }));
  el.querySelectorAll(".cat-btn").forEach(b=>b.addEventListener("click",()=>{
    cat=b.dataset.cat;refreshAll();closeDrawer();
  }));
}
function buildChips(){
  const el=document.getElementById("chips");
  el.innerHTML=CATS.map(c=>`<button class="chip${c===cat?" active":""}" data-cat="${c}">${c==="All"?"All":c}</button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{cat=b.dataset.cat;refreshAll();}));
}
function render(){
  const q=document.getElementById("searchInput").value.toLowerCase();
  const items=D[lang].filter(p=>{
    const catOk=cat==="All"||p.c===cat;
    const filtOk=filt==="all"||p.f===filt;
    const qOk=!q||p.n.toLowerCase().includes(q)||p.e.toLowerCase().includes(q);
    return catOk&&filtOk&&qOk;
  });
  document.getElementById("countEl").textContent=items.length+" phrases";
  const pl=document.getElementById("phraseList");
  if(!items.length){pl.innerHTML='<div class="empty">No phrases found.</div>';return;}
  const card=p=>`<div class="card">
    <div class="cn">${p.n}</div>
    <div class="ce">${p.e}</div>
    <div class="cmeta">
      <span class="tag tag-${p.f}">${TAG_LABEL[p.f]}</span>
      ${p.x?`<span class="cnote">${p.x}</span>`:""}
    </div>
  </div>`;
  if(cat==="All"){
    const g={};items.forEach(p=>{if(!g[p.c])g[p.c]=[];g[p.c].push(p);});
    pl.innerHTML=Object.entries(g).map(([s,ps])=>`<div class="sec">${s}</div>${ps.map(card).join("")}`).join("");
  } else {
    pl.innerHTML=items.map(card).join("");
  }
}
function refreshAll(){
  buildNav(document.getElementById("sidebar"));
  buildNav(document.getElementById("drawerInner"));
  buildChips();
  render();
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
}
document.getElementById("menuBtn").addEventListener("click",()=>{
  document.getElementById("drawer").classList.add("open");
  document.getElementById("overlay").classList.add("open");
});
document.getElementById("drawerClose").addEventListener("click",closeDrawer);
document.getElementById("overlay").addEventListener("click",closeDrawer);
document.getElementById("searchInput").addEventListener("input",render);
document.querySelectorAll(".ftag").forEach(b=>b.addEventListener("click",()=>{
  filt=b.dataset.f;
  document.querySelectorAll(".ftag").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  render();
}));

buildNav(document.getElementById("sidebar"));
buildNav(document.getElementById("drawerInner"));
buildChips();
render();
</script>
</body>
</html>
